[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tuplets-ai"
version = "0.3.1"
description = "Official Python SDK for the Tuplets transcription API — submit jobs, poll results, direct uploads, diarization, PII redaction, and analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Tuplets", email = "contact@tuplets.ai" },
]
keywords = ["tuplets", "transcription", "audio", "speech-to-text", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.urls]
Homepage = "https://tuplets.ai"
Documentation = "https://tuplets.ai/docs"
API = "https://api.tuplets.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/tuplets_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
